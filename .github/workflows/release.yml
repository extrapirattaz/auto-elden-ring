name: Test and build Auto Elden Ring
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Check tag and source version match
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from auto_elden_ring import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/source version mismatch" }
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: auto-elden-ring-release
          path: releases/**
      - name: Attach matched artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from auto_elden_ring import __version__; print(__version__)"
          $files = Get-ChildItem -LiteralPath "releases/$version" -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "Auto Elden Ring $version" --notes-file CHANGELOG.md
